name: two-db-compose

services:
  db1:
    image: postgres:18
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_PUBLIC_NAME}
    ports:
      - "127.0.0.1:${DB_PUBLIC_PORT}:5432"
    volumes:
      - db_public_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  db2:
    image: postgres:18
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${DB_PRIVATE_NAME}
    ports:
      - "127.0.0.1:${DB_PRIVATE_PORT}:5432"
    volumes:
      - db_private_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 20

  pgadmin4:
    image: elestio/pgadmin:${SOFTWARE_VERSION_TAG}
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
      PGADMIN_LISTEN_PORT: ${PGADMIN_PORT}
    ports:
      - "127.0.0.1:${PGADMIN_PORT}:${PGADMIN_PORT}"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      db1:
        condition: service_healthy
      db2:
        condition: service_healthy

  app:
    image: ghcr.io/astral-sh/uv:python3.12-bookworm-slim
    profiles: ["app"]
    working_dir: /app
    volumes:
      - ./:/app
      - uv_cache:/root/.cache/uv
    environment:
      DB1_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db1:5432/${DB_PUBLIC_NAME}
      DB2_URL: postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db2:5432/${DB_PRIVATE_NAME}
    command: uv run two_dbs.py
    depends_on:
      db1:
        condition: service_healthy
      db2:
        condition: service_healthy

volumes:
  db_public_data:
  db_private_data:
  pgadmin_data:
  uv_cache: